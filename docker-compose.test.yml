# ⚠️ STARTERPACK CORE — DO NOT MODIFY. This file is managed by the starterpack.
# E2E test environment - overrides for isolation from dev
services:
  db:
    volumes:
      - ./services/db-test/data:/var/lib/postgresql/data

  traefik-dev:
    env_file: !override
      - .env.ci
    environment:
      PUBLIC_PORT: "13001"
    ports: !override
      - "13001:13001"
      - "13080:8080"

  backend-dev:
    env_file: !override
      - .env.ci
    ports: !override
      - "13082:80"
      - "15679:5679"

  frontend-dev:
    env_file: !override
      - .env.ci
