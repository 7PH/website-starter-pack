# ⚠️ STARTERPACK CORE — DO NOT MODIFY. This file is managed by the starterpack.
# E2E test environment - overrides for isolation from dev.
# Host ports come from .env.ci (PUBLIC_PORT, TRAEFIK_DASHBOARD_PORT, BACKEND_DEBUG_PORT).
services:
  db:
    volumes:
      - ./services/db-test/data:/var/lib/postgresql/data

  traefik-dev:
    env_file: !override
      - .env.ci

  backend-dev:
    env_file: !override
      - .env.ci

  frontend-dev:
    env_file: !override
      - .env.ci
