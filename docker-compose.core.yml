# ⚠️ STARTERPACK CORE — DO NOT MODIFY. This file is managed by the starterpack.
x-traefik-common: &traefik-common
    container_name: ${COMPOSE_PROJECT_NAME}-traefik
    image: traefik:v2.9
    # No `command` here: Traefik reads static config from flags alone once any flag
    # is set, and a YAML merge key can't append to a sequence, so each profile
    # spells out its own list below.
    volumes:
        - ./services/traefik/dynamic.core.yml:/configuration/dynamic.core.yml:ro
        - ./services/traefik/dynamic.yml:/configuration/dynamic.yml:ro
        - "letsencrypt_traefik:/letsencrypt:rw"
    networks:
        - web
    env_file:
        - .env

x-frontend-common: &frontend-common
    volumes:
        - ./app/frontend/app.vue:/app/app.vue:ro
        - ./app/frontend/assets:/app/assets:ro
        - ./app/frontend/components:/app/components:ro
        - ./app/frontend/composables:/app/composables:ro
        - ./app/frontend/config:/app/config:ro
        - ./app/frontend/layouts:/app/layouts:ro
        - ./app/frontend/locales:/app/locales:ro
        - ./app/frontend/middleware:/app/middleware:ro
        - ./app/frontend/pages:/app/pages:ro
        - ./app/frontend/plugins:/app/plugins:ro
        - ./app/frontend/server:/app/server:ro
        - ./app/frontend/stores:/app/stores:ro
        - ./app/frontend/public:/app/public:ro
        - ./app/frontend/types:/app/types:ro
        - ./app/frontend/utils:/app/utils:ro
    environment:
        PUBLIC_URL: ${PUBLIC_URL}
        NUXT_PUBLIC_APP_NAME: ${APP_NAME}
        NUXT_PUBLIC_API_BASE: /api/v1
        NUXT_API_INTERNAL: http://backend:80/v1
        NUXT_PUBLIC_STRIPE_ENABLED: ${STRIPE_ENABLED:-false}
        NUXT_PUBLIC_ORGANIZATIONS_ENABLED: ${ORGANIZATIONS_ENABLED:-false}
        NUXT_PUBLIC_MANAGED_ACCOUNTS_ENABLED: ${MANAGED_ACCOUNTS_ENABLED:-false}
        NUXT_PUBLIC_ORG_SELF_SERVICE_SUBSCRIPTIONS: ${ORG_SELF_SERVICE_SUBSCRIPTIONS:-true}
        NUXT_PUBLIC_ORG_SELF_SERVICE_CREATION: ${ORG_SELF_SERVICE_CREATION:-true}
        NUXT_PUBLIC_ADMINER_URL: ${NUXT_PUBLIC_ADMINER_URL:-}
        NUXT_PUBLIC_UMAMI_DASHBOARD_URL: ${NUXT_PUBLIC_UMAMI_DASHBOARD_URL:-}
        NUXT_PUBLIC_DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
        # Build-time flag read by nuxt.config.ts. Compose propagates this to the
        # dev container at runtime; for prod-node, see build.args below.
        SITEMAP_ENABLED: ${SITEMAP_ENABLED:-true}
    networks:
        - web

x-backend-common: &backend-common
  container_name: ${COMPOSE_PROJECT_NAME}-backend
  build:
    context: ./app/backend
    dockerfile: Dockerfile
    args:
      - DOCKER_USER=${DOCKER_USER}
      - DOCKER_UID=${DOCKER_UID}
      - DOCKER_GID=${DOCKER_GID}
  env_file: .env
  volumes:
    - ./app/backend/src:/app/src
    - ./app/backend/tests:/app/tests
    - ./app/backend/pytest.ini:/app/pytest.ini:ro
    - ./app/backend/ruff.toml:/app/ruff.toml:ro
    - ./static:/app/static:rw
    - ./backups:/app/backups:rw
  networks:
    web:
      aliases:
        - backend
  deploy:
    resources:
      limits:
        cpus: '${BACKEND_CPU_LIMIT:-2}'
        memory: ${BACKEND_MEMORY_LIMIT:-1G}
      reservations:
        cpus: '${BACKEND_CPU_RESERVATION:-0.5}'
        memory: ${BACKEND_MEMORY_RESERVATION:-256M}

services:
    # Traefik reverse proxy (dev)
    traefik-dev:
        <<: *traefik-common
        command:
            - "--log.level=DEBUG"
            - "--api.insecure=true"
            - "--entrypoints.default.address=:${PUBLIC_PORT}"
            - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
            - "--certificatesresolvers.letsencrypt.acme.email=${ADMIN_EMAIL}"
            - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
            - "--providers.file.directory=/configuration/"
            - "--providers.file.watch=true"
        ports:
            - "${PUBLIC_PORT}:${PUBLIC_PORT}"
            - "127.0.0.1:${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
        profiles:
            - dev
            - debug
        environment:
            MODE: DEVELOPMENT

    # Traefik reverse proxy (prod)
    traefik-prod:
        <<: *traefik-common
        # No dashboard. INFO rather than Traefik's ERROR default, so prod and
        # preview log dumps stay readable.
        command:
            - "--log.level=INFO"
            - "--entrypoints.default.address=:${PUBLIC_PORT}"
            - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
            - "--certificatesresolvers.letsencrypt.acme.email=${ADMIN_EMAIL}"
            - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
            - "--providers.file.directory=/configuration/"
            - "--providers.file.watch=true"
        ports:
            # Bind all interfaces by default. Set PUBLIC_BIND_HOST=127.0.0.1 when a
            # host reverse proxy fronts the stack, so the public can't bypass it.
            - "${PUBLIC_BIND_HOST:-0.0.0.0}:${PUBLIC_PORT}:${PUBLIC_PORT}"
        profiles:
            - prod
        environment:
            MODE: PRODUCTION
        depends_on:
            - frontend-prod-nginx
            - backend-prod
    
    # Static file server
    static:
        container_name: ${COMPOSE_PROJECT_NAME}-static
        image: nginx:1.26-alpine3.20-perl
        volumes:
            - ./static:/usr/share/nginx/html:ro
            - ./services/static/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        networks:
            - web
        profiles:
            - prod
            - dev
            - debug

    # PostgreSQL database
    db:
        container_name: ${COMPOSE_PROJECT_NAME}-db
        image: postgres:15.10-alpine3.20
        environment:
            POSTGRES_DB: ${APP_DB_NAME}
            POSTGRES_USER: ${APP_DB_USER}
            POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
        volumes:
            - ./services/db/data:/var/lib/postgresql/data
            - ./services/db/initdb.sql:/docker-entrypoint-initdb.d/init_db.sql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER} -d ${APP_DB_NAME}"]
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            - web

    # Redis — rate-limit store (mandatory). Ephemeral: no persistence, since
    # rate-limit counters are short-lived and expire via key TTLs.
    redis:
        container_name: ${COMPOSE_PROJECT_NAME}-redis
        image: redis:7.4-alpine
        command: ["redis-server", "--save", "", "--appendonly", "no"]
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5
        networks:
            - web

    # Adminer database management tool
    adminer:
        container_name: ${COMPOSE_PROJECT_NAME}-adminer
        image: adminer
        restart: always
        profiles:
            - prod
            - dev
        networks:
            - web
        depends_on:
            - db

    # Backend for Development (with debugpy for optional debugging)
    backend-dev:
        <<: *backend-common
        entrypoint: python3 -m debugpy --log-to-stderr --listen 0.0.0.0:5679 -m
        command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "80", "--reload", "--root-path", "/api", "--no-server-header"]
        environment:
            MODE: DEVELOPMENT
        ports:
            - "127.0.0.1:${BACKEND_DEBUG_PORT:-5679}:5679"
        profiles:
            - dev
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy

    # Backend for Production
    # BACKEND_WORKERS>1 requires every scheduled job to use a cluster-singleton
    # lock (see src/tasks/_scheduler.py::_run_once_per_cluster).
    # ${BACKEND_WORKERS:-1} is interpolated by compose at parse time so uvicorn
    # remains PID 1 (no `sh -c` wrapper) and receives SIGTERM cleanly.
    backend-prod:
        <<: *backend-common
        command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "80", "--root-path", "/api", "--workers", "${BACKEND_WORKERS:-1}", "--no-server-header"]
        environment:
            MODE: PRODUCTION
        profiles:
            - prod
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy

    # Frontend for development (Nuxt)
    frontend-dev:
        <<: *frontend-common
        container_name: ${COMPOSE_PROJECT_NAME}-frontend
        build:
            context: ./app/frontend
            dockerfile: Dockerfile.dev
            args:
                - DOCKER_USER=${DOCKER_USER}
                - DOCKER_UID=${DOCKER_UID}
                - DOCKER_GID=${DOCKER_GID}
        networks:
            web:
                aliases:
                    - frontend
        profiles:
            - dev
            - debug

    # Frontend for production (Nuxt)
    frontend-prod-node:
        <<: *frontend-common
        container_name: ${COMPOSE_PROJECT_NAME}-frontend-node
        build:
            context: ./app/frontend
            dockerfile: Dockerfile.prod-node
            args:
                SITEMAP_ENABLED: ${SITEMAP_ENABLED:-true}
        networks:
            web:
                aliases:
                    - frontend-node
        profiles:
            - prod
        depends_on:
            - backend-prod

    frontend-prod-nginx:
        container_name: ${COMPOSE_PROJECT_NAME}-frontend
        build:
            context: ./app/frontend
            dockerfile: Dockerfile.prod-nginx
            # Must match frontend-prod-node, or the two builds' _nuxt hashes diverge.
            args:
                SITEMAP_ENABLED: ${SITEMAP_ENABLED:-true}
        profiles:
            - prod
        depends_on:
            - frontend-prod-node
        networks:
            web:
                aliases:
                    - frontend

    # Umami Analytics
    umami:
        container_name: ${COMPOSE_PROJECT_NAME}-umami
        image: ghcr.io/umami-software/umami:postgresql-latest
        restart: always
        profiles:
            - prod
            - dev
            - debug
        environment:
            DATABASE_URL: postgresql://${UMAMI_DB_USER:-umami}:${UMAMI_DB_PASSWORD:?set UMAMI_DB_PASSWORD in .env (see .env.template)}@umami-db:5432/${UMAMI_DB_NAME:-umami}
            DATABASE_TYPE: postgresql
            APP_SECRET: ${UMAMI_APP_SECRET:?set UMAMI_APP_SECRET in .env (see .env.template)}
            TRACKER_SCRIPT_NAME: analytics
            DISABLE_TELEMETRY: "1"
        depends_on:
            umami-db:
                condition: service_healthy
        networks:
            web:
                aliases:
                    - umami

    umami-db:
        container_name: ${COMPOSE_PROJECT_NAME}-umami-db
        image: postgres:15-alpine
        restart: always
        profiles:
            - prod
            - dev
            - debug
        environment:
            POSTGRES_DB: ${UMAMI_DB_NAME:-umami}
            POSTGRES_USER: ${UMAMI_DB_USER:-umami}
            POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:?set UMAMI_DB_PASSWORD in .env (see .env.template)}
        volumes:
            - ./services/umami/data:/var/lib/postgresql/data:rw
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${UMAMI_DB_USER:-umami} -d ${UMAMI_DB_NAME:-umami}"]
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            - web

volumes:
    letsencrypt_traefik:

networks:
    web:
        external: false
