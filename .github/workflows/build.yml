# ⚠️ STARTERPACK CORE — DO NOT MODIFY. This file is managed by the starterpack.

name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-prod:
    name: Build (prod)
    # PR preview already runs `docker compose --profile prod up -d --build`
    # and verifies the stack is healthy, which strictly covers what this job
    # would verify. Skip on same-repo PRs when preview is enabled. Always
    # run on push, on fork PRs, and on repos without preview infra.
    if: |
      github.event_name != 'pull_request' ||
      vars.PREVIEW_BASE_DOMAIN == '' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ vars.CI_RUNNER_LABEL && fromJson(format('["self-hosted", "{0}"]', vars.CI_RUNNER_LABEL)) || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Create CI environment file
        run: cp .env.ci .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # COMPOSE_BAKE=true makes `docker compose build` delegate to
      # `buildx bake`, which auto-loads docker-bake.override.hcl from cwd.
      # We inject per-image GHA cache scopes there so each prod image
      # reuses its own layer cache across runs. New services added by
      # sub-apps still build fine, just without cache until they extend
      # this file.
      - name: Write GHA cache config for compose
        run: |
          cat > docker-bake.override.hcl <<'HCL'
          target "frontend-prod-node" {
            cache-from = ["type=gha,scope=frontend-prod-node"]
            cache-to   = ["type=gha,scope=frontend-prod-node,mode=max"]
          }
          target "frontend-prod-nginx" {
            cache-from = ["type=gha,scope=frontend-prod-nginx"]
            cache-to   = ["type=gha,scope=frontend-prod-nginx,mode=max"]
          }
          target "backend-prod" {
            cache-from = ["type=gha,scope=backend-prod"]
            cache-to   = ["type=gha,scope=backend-prod,mode=max"]
          }
          HCL

      - name: Build prod profile
        env:
          COMPOSE_BAKE: "true"
        run: docker compose --profile prod build
