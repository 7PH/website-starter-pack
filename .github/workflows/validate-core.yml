# ⚠️ STARTERPACK CORE — DO NOT MODIFY. This file is managed by the starterpack.

name: Validate Core Files

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    name: Check core file consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate core files
        run: bash scripts/_core/validate-core-files.sh

      - name: Validate package.json files are in sync
        run: |
          # Regenerate package.json files
          sh scripts/_core/merge-package-json.sh .
          sh scripts/_core/merge-package-json.sh app/frontend

          # Check if they changed
          if ! git diff --exit-code package.json app/frontend/package.json; then
            echo ""
            echo "ERROR: package.json files are out of sync with package.core.json + package.app.json"
            echo "Run 'npm install' locally to regenerate them."
            exit 1
          fi
