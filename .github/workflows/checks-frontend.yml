# ⚠️ STARTERPACK CORE — DO NOT MODIFY. This file is managed by the starterpack.

name: Frontend Checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint + Typecheck + Vitest
    runs-on: ${{ vars.CI_RUNNER_LABEL && fromJson(format('["self-hosted", "{0}"]', vars.CI_RUNNER_LABEL)) || 'ubuntu-latest' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Each check runs even if a previous one failed, so all errors surface
      # in one run instead of requiring N pushes to discover them one by one.
      - name: Lint (ESLint)
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Type check (Nuxt)
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Unit tests (Vitest)
        id: vitest
        continue-on-error: true
        run: npm run test:unit

      - name: Fail if any check failed
        if: steps.lint.outcome == 'failure' || steps.typecheck.outcome == 'failure' || steps.vitest.outcome == 'failure'
        run: |
          echo "::error::One or more frontend checks failed:"
          echo "  lint:      ${{ steps.lint.outcome }}"
          echo "  typecheck: ${{ steps.typecheck.outcome }}"
          echo "  vitest:    ${{ steps.vitest.outcome }}"
          exit 1
