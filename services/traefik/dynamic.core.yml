# ⚠️ STARTERPACK CORE — DO NOT MODIFY. This file is managed by the starterpack.
http:
  routers:
    static:
      # `static-<host>` alias is for previews: per-PR previews live under a
      # single-level wildcard cert which can't cover `static.<two.level.host>`.
      rule: "Host(`static.{{env "PUBLIC_WEBSITE_HOST"}}`) || Host(`static-{{env "PUBLIC_WEBSITE_HOST"}}`)"
      entryPoints: default
      service: static
      {{ if eq (env "USE_TLS") "true" }}
      tls:
        certResolver: letsencrypt
      {{ end }}

    frontend:
      rule: "Host(`{{env "PUBLIC_WEBSITE_HOST"}}`)"
      entryPoints: default
      service: frontend
      {{ if eq (env "USE_TLS") "true" }}
      tls:
        certResolver: letsencrypt
      {{ end }}

    backend:
      rule: "Host(`{{env "PUBLIC_WEBSITE_HOST"}}`) && PathPrefix(`/api`)"
      entryPoints: default
      service: backend
      middlewares:
        - api-strip-prefix
      {{ if eq (env "USE_TLS") "true" }}
      tls:
        certResolver: letsencrypt
      {{ end }}

    adminer:
      rule: "Host(`{{env "ADMINER_SUBDOMAIN"}}.{{env "PUBLIC_WEBSITE_HOST"}}`)"
      entryPoints: default
      service: adminer
      middlewares:
        - admin-auth-middleware
      {{ if eq (env "USE_TLS") "true" }}
      tls:
        certResolver: letsencrypt
      {{ end }}

    # Umami Analytics
    umami:
      rule: "Host(`{{env "UMAMI_SUBDOMAIN"}}.{{env "PUBLIC_WEBSITE_HOST"}}`)"
      entryPoints: default
      service: umami
      middlewares:
        - admin-auth-middleware
      {{ if eq (env "USE_TLS") "true" }}
      tls:
        certResolver: letsencrypt
      {{ end }}

  services:
    static:
      loadBalancer:
        servers:
          - url: "http://static:80"
    
    frontend:
      loadBalancer:
        servers:
          - url: "http://frontend:80"

    backend:
      loadBalancer:
        servers:
          - url: "http://backend:80"

    adminer:
      loadBalancer:
        servers:
          - url: "http://adminer:8080"

    umami:
      loadBalancer:
        servers:
          - url: "http://umami:3000"

  middlewares:
    api-strip-prefix:
      stripPrefix:
        prefixes:
          - "/api"

    admin-auth-middleware:
      chain:
        middlewares:
          - rate-limit-middleware
          - basic-auth-middleware

    basic-auth-middleware:
      basicAuth:
        users:
        - "{{ env "BASIC_AUTH" }}"

    rate-limit-middleware:
      rateLimit:
        average: 5
        burst: 10
