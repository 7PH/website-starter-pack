# ⚠️ STARTERPACK CORE — DO NOT MODIFY. This file is managed by the starterpack.
# Config for the `static` media host. Adds the security headers the stock nginx
# image omits (the backend/frontend set these themselves; this host did not).

include /etc/nginx/static-ext/http/*.conf;

server {
    listen 80;
    server_name _;
    server_tokens off;                              # hide nginx version
    root /usr/share/nginx/html;

    # nginx drops inherited add_header in any block that sets one of its own, so a
    # sub-app location adding headers has to repeat this.
    add_header X-Content-Type-Options nosniff always;

    location / {
        try_files $uri =404;
    }

    include /etc/nginx/static-ext/server/*.conf;
}
