# ⚠️ STARTERPACK CORE — DO NOT MODIFY. This file is managed by the starterpack.
server {
    listen 80;
    server_tokens off;

    location /_nuxt/ {
        root /usr/share/nginx/html;
        # Hashed file names change every build, so a file found here never changes
        add_header Cache-Control "public, max-age=31536000, immutable";
        # A file missing mid-deploy must not be cached (eg by a CDN), or the 404 outlives the deploy
        error_page 404 = @nuxt_missing;
    }

    location @nuxt_missing {
        add_header Cache-Control "no-store" always;
        return 404;
    }

    location / {
        proxy_pass http://frontend-node:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
